name: Repository Standards

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: repository-standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate required docs and README badges
        run: python3 scripts/validate_repository_standards.py
